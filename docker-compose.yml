services:
  postgres:
    image: postgres:16
    container_name: jobqueue-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - jobqueue_pg_data:/var/lib/postgresql/data
  postgres-test:
    image: postgres:16
    container_name: jobqueue-postgres-test
    ports:
      - "5433:5432"
    environment:
       POSTGRES_USER: ${TEST_DB_USER}
       POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
       POSTGRES_DB: ${TEST_DB_NAME}
    volumes:
      - jobqueue_pg_test_data:/var/lib/postgresql/data
volumes:
  jobqueue_pg_data:
  jobqueue_pg_test_data:
